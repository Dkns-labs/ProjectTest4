<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeIQ — Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
    <div class="wrap header-row">
        <a class="logo" href="{{ url_for('home') }}">Resume<span>IQ</span></a>
        <nav>
            <a href="{{ url_for('login') }}">Sign in</a>
            <a class="nav-button" href="{{ url_for('register') }}">Start now</a>
        </nav>
    </div>
</header>
<main class="auth-page">
    <section class="auth-card">
        <div class="eyebrow">Start here</div>
        <h1>Create account.</h1>
        <p class="muted big-text">Your resume workspace starts here.</p>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post">
            <div class="two-inputs">
                <div>
                    <label for="first_name">First name</label>
                    <input id="first_name" name="first_name" required>
                </div>
                <div>
                    <label for="last_name">Last name</label>
                    <input id="last_name" name="last_name" required>
                </div>
            </div>
            <label for="username">Username</label>
            <input id="username" name="username" required>
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password" name="confirm_password" required>
            <button class="full-button" type="submit">Create account</button>
        </form>
        <p class="form-link">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
    </section>
</main>
</body>
</html>
