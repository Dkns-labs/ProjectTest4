<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ResumeIQ — Register</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>
<header><div class="logo">Resume<span>IQ</span>
</div><div class="header-actions">
<input type="checkbox" id="theme-toggle">
<label class="theme-toggle" for="theme-toggle">Dark mode</label><a class="header-button" href="{{ url_for('login') }}">Login</a>
</div>
</header>
<main class="page center">
    <section class="card auth-card"><h1>Create account</h1><p class="subtitle">Set up your ResumeIQ account in a few simple steps.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="message">{{ message }}
    </div>{% endfor %}{% endwith %}
    <form method="POST"><label>First Name</label><input type="text" name="first_name" autocomplete="given-name" required><label>Last Name</label><input type="text" name="last_name" autocomplete="family-name" required><label>Username</label><input type="text" name="username" autocomplete="username" required><label>Email</label><input type="email" name="email" autocomplete="email" required><label>Password</label><input type="password" name="password" autocomplete="new-password" required><label>Confirm Password</label><input type="password" name="confirm_password" autocomplete="new-password" required><button type="submit">Create Account</button>
    </form><p>Already have an account? <a href="{{ url_for('login') }}">Back to Login</a></p>
</section>
</main></body>
</html>
