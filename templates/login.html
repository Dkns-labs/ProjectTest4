<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResumeIQ — Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><div class="header-inner"><a class="logo" href="{{ url_for('home') }}">Resume<span>IQ</span></a><a class="header-button" href="{{ url_for('register') }}">Create Account</a></div></header><main class="center"><section class="card auth"><span class="kicker">Welcome back</span><h1>Login</h1><p class="subtitle">Continue to your resume analyzer.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('login') }}"><label>Email</label><input type="email" name="email" autocomplete="email" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">Login</button></form><p>No account? <a href="{{ url_for('register') }}">Create one</a></p></section></main></body></html>
