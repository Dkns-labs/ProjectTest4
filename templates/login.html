<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeIQ — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="header">
    <div class="wrap header-row">
        <a class="logo" href="{{ url_for('home') }}">Resume<span>IQ</span></a>
        <nav>
            <a href="{{ url_for('login') }}">Login</a>
            <a class="nav-button" href="{{ url_for('register') }}">Start now</a>
        </nav>
    </div>
</header>
<main class="auth-page">
    <section class="auth-card">
        <div class="eyebrow">Welcome back</div>
        <h1>Sign in.</h1>
        <p class="muted big-text">Open your ResumeIQ workspace.</p>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
            <button class="full-button" type="submit">Sign in</button>
        </form>
        <p class="form-link">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </section>
</main>
</body>
</html>
