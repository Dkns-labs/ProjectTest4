<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ResumeIQ — Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body>
<header><div class="logo">Resume<span>IQ</span>
</div><div class="header-actions">
<input type="checkbox" id="theme-toggle">
<label class="theme-toggle" for="theme-toggle">Dark mode</label><a class="header-button" href="{{ url_for('login') }}">Login</a>
</div>
</header>
<main class="page center">
    <section class="card auth-card"><h1>Welcome back</h1><p class="subtitle">Sign in to continue to your ResumeIQ dashboard.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="message">{{ message }}
    </div>{% endfor %}{% endwith %}
    <form method="POST"><label>Email</label><input type="email" name="email" autocomplete="email" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">Login to ResumeIQ</button>
    </form><p>No account? <a href="{{ url_for('register') }}">Create one</a></p>
</section>
</main></body>
</html>
